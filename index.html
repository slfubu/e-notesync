<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบสร้างบันทึกข้อความเบิกจ่าย | ม.อุบลราชธานี</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden; /* ไม่ให้มี Scrollbar ซ้อนกัน */
        }
        iframe {
            width: 100%;
            height: 100vh;
            border: none;
        }
    </style>
</head>
<body>

    <iframe 
        src="https://script.google.com/macros/s/AKfycbwYqfHYTQuuU6O4mU-Y1BJgFxRRIEjrtzZ2dRqFXYtm0FdtRH9gEr_Widn69ApUFnwB/exec" 
        sandbox="allow-scripts allow-same-origin allow-top-navigation allow-forms allow-downloads allow-popups">
    </iframe>

    <script>
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'download_pdf') {
                try {
                    const base64Data = event.data.base64;
                    const fileName = event.data.filename || 'document.pdf';
                    
                    const link = document.createElement('a');
                    link.href = 'data:application/pdf;base64,' + base64Data;
                    link.download = fileName;
                    
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                } catch (error) {
                    console.error("Error saving file:", error);
                    alert("เบราว์เซอร์ของคุณบล็อกการดาวน์โหลด กรุณาลองใหม่อีกครั้ง");
                }
            }
        });
    </script>

</body>
</html>
